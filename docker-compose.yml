version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: veriQO_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: veriQO_user
      POSTGRES_PASSWORD: veriQO_pass
      POSTGRES_DB: veriQO_db
    ports:
      - '5432:5432'
    volumes:
      - veriQO_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U veriQO_user -d veriQO_db']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  veriQO_postgres_data:
